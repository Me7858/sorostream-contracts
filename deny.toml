# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

# ── Advisory database ────────────────────────────────────────────────────────
[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
notice = "warn"

# ── License checking ─────────────────────────────────────────────────────────
[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]

# To skip a specific crate's license check, add an entry like:
# [[licenses.clarify]]
# name = "ring"
# expression = "MIT AND ISC AND OpenSSL"
# license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# ── Dependency bans ──────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "allow"

# To allow specific crates that would otherwise be banned:
# [[bans.allow]]
# name = "crate-name"

# ── Source restrictions ──────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
