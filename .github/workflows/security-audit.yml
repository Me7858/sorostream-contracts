name: Weekly Security Audit

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  weekly-audit:
    name: Weekly Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo audit
        run: cargo audit --deny critical
      - name: Generate audit report
        if: always()
        run: |
          echo "# Security Audit Report" > audit-report.md
          echo "" >> audit-report.md
          echo "## Cargo Audit Results" >> audit-report.md
          cargo audit --json >> audit-report.md || echo "No vulnerabilities found" >> audit-report.md
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: audit-report.md
          retention-days: 30
