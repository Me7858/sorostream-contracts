name: SDK Version Cost Benchmark

# Runs on every PR that bumps soroban-sdk in Cargo.toml or Cargo.lock,
# and on direct pushes to main (to keep the baseline fresh).
#
# Purpose
# -------
# When soroban-sdk releases a new minor version the generated WASM and its
# runtime instruction cost can change.  This workflow:
#
#   1. Runs the cost-regression tests defined in `contracts/stream/src/cost_bench.rs`
#      against the current pinned SDK version.
#   2. Compares each instruction's CPU cost against the committed baseline stored
#      in `benches/sdk-cost-baseline.json`.
#   3. Fails with a clear message if any cost increases by more than
#      `COST_INCREASE_THRESHOLD_PCT` percent.
#   4. On pushes to `main`, updates the baseline JSON so future PRs have an
#      accurate comparison point.
#
# Threshold configuration
# -----------------------
# Set `COST_INCREASE_THRESHOLD_PCT` below to change the allowed cost growth.
# The default is 10 % — consistent with the existing gas regression tests in
# `cost_bench.rs`.  To override for a single PR, update the env var here and
# revert after merging.

on:
  pull_request:
    paths:
      # Fire on any change to dependency manifests (SDK version bumps land here)
      - "Cargo.toml"
      - "Cargo.lock"
      - "contracts/*/Cargo.toml"
      # Also fire when the benchmark code itself changes
      - "contracts/stream/src/cost_bench.rs"
      - ".github/workflows/sdk-cost-benchmark.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "contracts/*/Cargo.toml"
      - "contracts/stream/src/cost_bench.rs"

env:
  # Maximum allowed percentage increase in CPU instructions per instruction.
  # Raise this value (e.g. to 20) if a known-good SDK upgrade exceeds the default.
  COST_INCREASE_THRESHOLD_PCT: "10"

jobs:
  # ── Step 1: detect whether soroban-sdk version changed ──────────────────────
  detect-sdk-bump:
    name: Detect soroban-sdk version change
    runs-on: ubuntu-latest
    outputs:
      sdk_changed: ${{ steps.check.outputs.sdk_changed }}
      old_version: ${{ steps.check.outputs.old_version }}
      new_version: ${{ steps.check.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for soroban-sdk version change
        id: check
        shell: bash
        run: |
          # Extract soroban-sdk version from current Cargo.toml
          NEW=$(grep -m1 'soroban-sdk' contracts/stream/Cargo.toml \
                | grep -oP '"\K[0-9]+\.[0-9]+\.[0-9]+(?=")' || echo "unknown")

          # Extract from the parent commit (HEAD~1) if on a PR branch
          OLD=$(git show HEAD~1:contracts/stream/Cargo.toml 2>/dev/null \
                | grep -m1 'soroban-sdk' \
                | grep -oP '"\K[0-9]+\.[0-9]+\.[0-9]+(?=")' || echo "unknown")

          echo "old_version=$OLD" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"

          if [ "$OLD" != "$NEW" ] && [ "$OLD" != "unknown" ] && [ "$NEW" != "unknown" ]; then
            echo "sdk_changed=true"  >> "$GITHUB_OUTPUT"
            echo "::notice::soroban-sdk version changed: $OLD → $NEW"
          else
            echo "sdk_changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::soroban-sdk version unchanged ($NEW); running cost check anyway."
          fi

  # ── Step 2: run cost benchmarks at the current SDK version ──────────────────
  cost-benchmark:
    name: Run cost benchmarks (soroban-sdk ${{ needs.detect-sdk-bump.outputs.new_version }})
    runs-on: ubuntu-latest
    needs: detect-sdk-bump
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run cost-regression benchmarks (capture output)
        id: bench
        run: |
          # Run only the cost regression tests; suppress test harness noise.
          cargo test --package sorostream-stream \
            -- cost_regression --nocapture 2>&1 \
            | tee /tmp/bench_raw.txt

          echo "--- raw benchmark output ---"
          cat /tmp/bench_raw.txt

      - name: Extract CPU instruction counts
        id: extract
        shell: bash
        run: |
          # The cost_bench.rs tests print lines like:
          #   BASELINE     : "create_stream": 340301
          # We extract those and build a JSON cost report.

          declare -A costs

          while IFS= read -r line; do
            if [[ "$line" =~ BASELINE[[:space:]]*:[[:space:]]*\"([^\"]+)\":[[:space:]]*([0-9]+) ]]; then
              name="${BASH_REMATCH[1]}"
              value="${BASH_REMATCH[2]}"
              costs["$name"]="$value"
            fi
          done < /tmp/bench_raw.txt

          # Build a JSON object from the extracted costs.
          json="{"
          first=true
          for key in "${!costs[@]}"; do
            if [ "$first" = true ]; then
              first=false
            else
              json+=","
            fi
            json+="\"$key\": ${costs[$key]}"
          done
          json+="}"

          echo "costs_json=$json" >> "$GITHUB_OUTPUT"
          echo "Current costs: $json"

      - name: Compare against baseline
        id: compare
        shell: bash
        env:
          CURRENT_COSTS: ${{ steps.extract.outputs.costs_json }}
          THRESHOLD: ${{ env.COST_INCREASE_THRESHOLD_PCT }}
        run: |
          BASELINE_FILE="benches/sdk-cost-baseline.json"

          if [ ! -f "$BASELINE_FILE" ]; then
            echo "::warning::No baseline file found at $BASELINE_FILE — skipping comparison."
            echo "Run the 'Update cost baseline' job on main to create it."
            exit 0
          fi

          echo "Baseline file: $BASELINE_FILE"
          cat "$BASELINE_FILE"
          echo ""
          echo "Current costs: $CURRENT_COSTS"
          echo ""

          # Use Python for reliable JSON + float arithmetic (available on ubuntu-latest).
          python3 - <<'PYEOF'
          import json, os, sys

          current_raw = os.environ["CURRENT_COSTS"]
          threshold   = float(os.environ["THRESHOLD"]) / 100.0

          with open("benches/sdk-cost-baseline.json") as f:
              baseline = json.load(f)

          current = json.loads(current_raw)

          print(f"{'Instruction':<30} {'Baseline':>12} {'Current':>12} {'Change':>10}  {'Status':>8}")
          print("-" * 80)

          failures = []
          for name, baseline_val in baseline.items():
              if name.startswith("_"):
                  continue
              current_val = current.get(name)
              if current_val is None:
                  print(f"  {name:<28} {baseline_val:>12}  {'N/A':>12}  {'N/A':>10}  ⚠ MISSING")
                  continue
              change_pct = (current_val - baseline_val) / max(baseline_val, 1) * 100
              status = "✅ OK"
              if current_val > baseline_val * (1 + threshold):
                  status = "❌ FAIL"
                  failures.append(
                      f"{name}: {current_val} instructions exceeds baseline {baseline_val} "
                      f"by {change_pct:.1f}% (threshold: {threshold*100:.0f}%)"
                  )
              elif current_val < baseline_val:
                  status = "⬇ CHEAPER"
              print(f"  {name:<28} {baseline_val:>12}  {current_val:>12}  {change_pct:>+9.1f}%  {status}")

          print()
          if failures:
              print(f"FAILED: {len(failures)} instruction(s) exceeded the {threshold*100:.0f}% threshold:")
              for f in failures:
                  print(f"  • {f}")
              sys.exit(1)
          else:
              print(f"All instruction costs within {threshold*100:.0f}% of baseline. ✅")
          PYEOF

      - name: Annotate PR with cost summary (SDK bump only)
        if: needs.detect-sdk-bump.outputs.sdk_changed == 'true' && github.event_name == 'pull_request'
        shell: bash
        env:
          CURRENT_COSTS: ${{ steps.extract.outputs.costs_json }}
          OLD_VERSION: ${{ needs.detect-sdk-bump.outputs.old_version }}
          NEW_VERSION: ${{ needs.detect-sdk-bump.outputs.new_version }}
        run: |
          python3 - <<'PYEOF'
          import json, os

          current = json.loads(os.environ["CURRENT_COSTS"])
          old_ver = os.environ["OLD_VERSION"]
          new_ver = os.environ["NEW_VERSION"]

          with open("benches/sdk-cost-baseline.json") as f:
              baseline = json.load(f)

          lines = [
              f"## soroban-sdk cost impact: {old_ver} → {new_ver}",
              "",
              "| Instruction | Baseline (CPU insns) | Current (CPU insns) | Change |",
              "|-------------|---------------------|---------------------|--------|",
          ]
          for name, base_val in baseline.items():
              if name.startswith("_"):
                  continue
              cur_val = current.get(name, "N/A")
              if isinstance(cur_val, int):
                  change = (cur_val - base_val) / max(base_val, 1) * 100
                  change_str = f"{change:+.1f}%"
              else:
                  change_str = "N/A"
              lines.append(f"| `{name}` | {base_val:,} | {cur_val:,} | {change_str} |")

          print("\n".join(lines))
          PYEOF

  # ── Step 3: update baseline on main (so future PRs compare against latest) ──
  update-baseline:
    name: Update cost baseline (main only)
    runs-on: ubuntu-latest
    needs: cost-benchmark
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run cost-regression benchmarks
        run: |
          cargo test --package sorostream-stream \
            -- cost_regression --nocapture 2>&1 \
            | tee /tmp/bench_raw.txt

      - name: Extract and write new baseline
        shell: bash
        run: |
          SDK_VERSION=$(grep -m1 'soroban-sdk' contracts/stream/Cargo.toml \
                        | grep -oP '"\K[0-9]+\.[0-9]+\.[0-9]+(?=")' || echo "unknown")

          declare -A costs

          while IFS= read -r line; do
            if [[ "$line" =~ BASELINE[[:space:]]*:[[:space:]]*\"([^\"]+)\":[[:space:]]*([0-9]+) ]]; then
              costs["${BASH_REMATCH[1]}"]="${BASH_REMATCH[2]}"
            fi
          done < /tmp/bench_raw.txt

          # Build JSON — include a metadata comment field for traceability.
          {
            echo "{"
            echo "  \"_comment\": \"CPU instruction baselines recorded at soroban-sdk $SDK_VERSION. Update by pushing to main.\","
            echo "  \"_sdk_version\": \"$SDK_VERSION\","
            first=true
            for key in "${!costs[@]}"; do
              if [ "$first" = true ]; then
                first=false
              else
                echo ","
              fi
              printf "  \"%s\": %s" "$key" "${costs[$key]}"
            done
            echo ""
            echo "}"
          } > benches/sdk-cost-baseline.json

          echo "New baseline:"
          cat benches/sdk-cost-baseline.json

      - name: Commit updated baseline
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(bench): update SDK cost baseline [skip ci]"
          file_pattern: "benches/sdk-cost-baseline.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
